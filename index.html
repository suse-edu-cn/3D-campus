<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>四川轻化工大学宜宾校区 · 3D 地图</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          'PingFang SC',
          'Hiragino Sans GB',
          'Microsoft YaHei',
          system-ui,
          sans-serif;
        background: #aee3f5;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      .title-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 12px 20px;
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 2px;
        color: #fff;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        z-index: 10;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
        background: #aee3f5;
        z-index: 20;
        transition: opacity 0.5s;
        font-size: 15px;
        color: #4a6a80;
        letter-spacing: 2px;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(74, 106, 128, 0.25);
        border-top-color: #4a6a80;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .ui-toggle {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 15;
        padding: 8px 14px;
        font-size: 13px;
        letter-spacing: 1px;
        color: #fff;
        background: rgba(30, 60, 90, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 18px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        display: none;
      }
      .ui-toggle:hover {
        background: rgba(30, 60, 90, 0.9);
      }
      .map-label {
        display: block;
        font-size: 12px;
        line-height: 1.35;
        font-weight: 500;
        color: #24455e;
        text-shadow:
          0 0 3px #fff,
          0 0 6px #fff,
          0 1px 2px rgba(255, 255, 255, 0.9);
        white-space: nowrap;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      .map-label-gate {
        color: #a5382f;
        font-weight: 600;
        font-size: 13px;
      }
      .map-label-water {
        color: #2b6f9e;
        font-style: italic;
      }
      .map-label-campus {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #1d3d55;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="title-bar">四川轻化工大学宜宾校区 · 3D 地图</div>
    <button id="labels-toggle" class="ui-toggle" type="button">隐藏标签</button>
    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text">正在加载校园数据…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
