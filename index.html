<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>四川轻化工大学宜宾校区 · 3D 地图</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          'PingFang SC',
          'Hiragino Sans GB',
          'Microsoft YaHei',
          system-ui,
          sans-serif;
        background: #aee3f5;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      .title-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 12px 20px;
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 2px;
        color: #fff;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        z-index: 10;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
        background: #aee3f5;
        z-index: 20;
        transition: opacity 0.5s;
        font-size: 15px;
        color: #4a6a80;
        letter-spacing: 2px;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(74, 106, 128, 0.25);
        border-top-color: #4a6a80;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="title-bar">四川轻化工大学宜宾校区 · 3D 地图</div>
    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text">正在加载校园数据…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
