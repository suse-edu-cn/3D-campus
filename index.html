<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>四川轻化工大学宜宾校区 · 3D 地图</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          'PingFang SC',
          'Hiragino Sans GB',
          'Microsoft YaHei',
          system-ui,
          sans-serif;
        background: #aee3f5;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      .title-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 12px 20px;
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 2px;
        color: #fff;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        z-index: 10;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
        background: #aee3f5;
        z-index: 20;
        transition: opacity 0.5s;
        font-size: 15px;
        color: #4a6a80;
        letter-spacing: 2px;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(74, 106, 128, 0.25);
        border-top-color: #4a6a80;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .ui-toggle {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 15;
        padding: 8px 14px;
        font-size: 13px;
        letter-spacing: 1px;
        color: #fff;
        background: rgba(30, 60, 90, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 18px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        display: none;
      }
      .ui-toggle:hover {
        background: rgba(30, 60, 90, 0.9);
      }
      .map-label {
        display: block;
        font-size: 12px;
        line-height: 1.35;
        font-weight: 500;
        color: #24455e;
        text-shadow:
          0 0 3px #fff,
          0 0 6px #fff,
          0 1px 2px rgba(255, 255, 255, 0.9);
        white-space: nowrap;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      .map-label-gate {
        color: #a5382f;
        font-weight: 600;
        font-size: 13px;
      }
      .map-label-water {
        color: #2b6f9e;
        font-style: italic;
      }
      .map-label-campus {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #1d3d55;
      }
      #info-panel {
        position: fixed;
        right: 16px;
        top: 64px;
        width: 248px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 10px;
        padding: 14px 16px 12px;
        z-index: 12;
        box-shadow: 0 4px 18px rgba(20, 50, 80, 0.22);
        font-size: 13px;
        color: #2a415a;
      }
      #info-panel.hidden {
        display: none;
      }
      #info-name {
        font-size: 15px;
        margin: 0 18px 8px 0;
        color: #1d3d55;
      }
      #info-close {
        position: absolute;
        top: 8px;
        right: 10px;
        border: none;
        background: none;
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
        color: #90a8bb;
      }
      #info-close:hover {
        color: #4a6a80;
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        padding: 3px 0;
        color: #647c92;
      }
      .info-row b {
        color: #2a415a;
        font-weight: 600;
      }
      #info-desc {
        margin: 8px 0 0;
        padding-top: 8px;
        border-top: 1px dashed #c9d6e0;
        line-height: 1.55;
        color: #50687e;
      }
      #info-fly {
        margin-top: 10px;
        width: 100%;
        padding: 7px 0;
        border: 1px solid #bcd0dd;
        border-radius: 7px;
        background: #eaf3f9;
        color: #2a5a80;
        font-size: 12px;
        letter-spacing: 1px;
        cursor: pointer;
      }
      #info-fly:hover {
        background: #dcebf5;
      }
      #mode-hint {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 12;
        padding: 7px 16px;
        border-radius: 16px;
        background: rgba(20, 45, 70, 0.72);
        color: #fff;
        font-size: 12px;
        letter-spacing: 1px;
        display: none;
        backdrop-filter: blur(4px);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="title-bar">四川轻化工大学宜宾校区 · 3D 地图</div>
    <button id="labels-toggle" class="ui-toggle" type="button">隐藏标签</button>
    <button id="mode-toggle" class="ui-toggle" type="button" style="right: 104px;">自动巡游</button>
    <div id="info-panel" class="hidden">
      <button id="info-close" type="button">×</button>
      <h2 id="info-name"></h2>
      <div id="info-rows"></div>
      <p id="info-desc"></p>
      <button id="info-fly" type="button">镜 头 定 位</button>
    </div>
    <div id="mode-hint">步行模式:WASD / 方向键移动 · Shift 加速 · 按住拖动转头 · ESC 退出</div>
    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text">正在加载校园数据…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
